name: Bug report
description: Report a reproducible problem using synthetic data only
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include real complaints, evidence, identities, credentials, secrets, tokens, or exact locations. Report security vulnerabilities privately according to SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide minimal steps using synthetic test data.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision or commit
      placeholder: Commit hash or branch name
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Public or reporter interface
        - Authentication or sessions
        - NGO or investigator workspace
        - Administration or review
        - Evidence
        - Chat or realtime behavior
        - Internal SOS
        - Accessibility or localization
        - Deployment
        - Other
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Additional context
      description: Add sanitized logs or screenshots if useful.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed all personal data, secrets, credentials, real case content, and exact locations.
          required: true
        - label: This report does not disclose a security vulnerability publicly.
          required: true
