services:
  - type: web
    name: satyashield-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: UPLOADS_DIR
        value: /opt/render/project/uploads
      - key: SERVER_PUBLIC_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REPORTER_ACCESS_HMAC_KEY
        sync: false
      - key: REPORTER_TOKEN_SECRET
        sync: false
      - key: STAFF_ACCESS_TOKEN_SECRET
        sync: false
      - key: REFRESH_TOKEN_PEPPER
        sync: false
      - key: VERIFICATION_TOKEN_PEPPER
        sync: false
      - key: PASSWORD_RESET_TOKEN_PEPPER
        sync: false
      - key: MFA_CHALLENGE_TOKEN_PEPPER
        sync: false
      - key: RECOVERY_CODE_PEPPER
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: EVIDENCE_ENCRYPTION_KEY
        sync: false
      - key: REPORTER_TOKEN_AUDIENCE
        value: satyashield-reporter-case
      - key: REPORTER_TOKEN_EXPIRES_IN
        value: 15m
      - key: JWT_ISSUER
        value: dahej-control-system
      - key: JWT_AUDIENCE
        value: dahej-control-system-admin
      - key: LOCATION_ENCRYPTION_KEY
        sync: false
      - key: EVIDENCE_STORAGE_DIR
        value: /tmp/satyashield-evidence
      - key: EVIDENCE_STORAGE_PROVIDER
        value: object
      - key: EVIDENCE_OBJECT_BUCKET
        sync: false
      - key: EVIDENCE_OBJECT_REGION
        sync: false
      - key: EVIDENCE_OBJECT_ENDPOINT
        sync: false
      - key: EVIDENCE_OBJECT_ACCESS_KEY_ID
        sync: false
      - key: EVIDENCE_OBJECT_SECRET_ACCESS_KEY
        sync: false
      - key: EVIDENCE_SCANNER_MODE
        value: http
      - key: EVIDENCE_SCANNER_URL
        sync: false
      - key: EVIDENCE_SCANNER_TOKEN
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CLIENT_URL
        sync: false
      - key: BCRYPT_SALT_ROUNDS
        value: 10
      - key: AI_PROCESSING_ENABLED
        value: false
      - key: TRIAGE_AI_ENABLED
        value: false
      - key: SOCKET_IO_ENABLED
        value: true
      - key: SOCKET_SINGLE_INSTANCE_MODE
        value: true
      - key: SOCKET_ADAPTER
        value: memory
      - key: SOS_ENABLED
        value: true
      - key: SOS_LOCATION_ENABLED
        value: true
      - key: SOS_INTERNAL_ROUTING_ENABLED
        value: true
      - key: SOS_EXTERNAL_DELIVERY_ENABLED
        value: false
